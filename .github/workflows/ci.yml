name: CI · Maré Certa

on:
  push:
    branches: [main, B]
  pull_request:
    branches: [main, B]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static assets
        run: npm run build

      - name: Run unit test suite
        run: npm test
